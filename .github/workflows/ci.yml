name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.25.13'

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Eval smoke dry-run
        run: go run ./cmd/gokin eval run --dry-run --scenario go_bugfix_targeted_test --output /tmp/gokin-eval-dryrun.jsonl

      - name: Eval smoke synthetic scenario
        run: |
          go run ./cmd/gokin eval run \
            --scenario go_bugfix_targeted_test \
            --workdir /tmp/gokin-eval-smoke \
            --output /tmp/gokin-eval-smoke.jsonl \
            --agent-command 'sh "$GITHUB_WORKSPACE/evals/coding/scripts/fix-go-validation.sh"'

      - name: Eval fixture contracts
        # Every "red" fixture must FAIL its verification as delivered and
        # every "green" trap must PASS — a red fixture that already passes
        # scores any agent as successful and measures nothing.
        run: go run ./cmd/gokin eval validate

      - name: Coverage summary
        # Print per-package coverage and total. Fails the job if total drops
        # below the baseline — set intentionally low so additive PRs can't
        # slip in without at least being measured. Lift gradually as test
        # coverage grows.
        run: |
          go tool cover -func=coverage.out | tail -n 40
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%",""); print $3}')
          echo "::notice title=Coverage::total=${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 17.0) { print "ERROR: coverage " t "% below 17% floor"; exit 1 } }'

      - name: Upload coverage
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6
        with:
          files: coverage.out
        continue-on-error: true

  release-toolchain:
    # release.yml resolves a FLOATING go-version and setup-go pins
    # GOTOOLCHAIN=local, so a go.mod directive newer than whatever that
    # resolution installs breaks the release build — and ONLY there, because
    # every other job here pins an explicit version. v0.100.140 failed exactly
    # that way, fifteen seconds in, after the tag had already been pushed.
    # This job reproduces the release toolchain so the failure lands in CI.
    # Keep go-version identical to release.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.25'

      - name: The guard must use the same toolchain spec as release.yml
        # Otherwise this job silently stops reproducing the release build.
        run: |
          set -euo pipefail
          ci=$(grep -A2 'setup-go' .github/workflows/ci.yml | grep -m1 "go-version: '1.25'" || true)
          rel=$(grep -m1 "go-version:" .github/workflows/release.yml | tr -d " '")
          test -n "$ci" || { echo "ci.yml release-toolchain job no longer pins go-version: '1.25'"; exit 1; }
          test "$rel" = "go-version:1.25" || {
            echo "release.yml now uses $rel — update the release-toolchain job in ci.yml to match"; exit 1; }

      - name: Build under the release toolchain
        # Set explicitly rather than relying on setup-go's default: if that
        # default ever changed to auto, the toolchain would be downloaded and
        # this guard would silently stop guarding.
        env:
          GOTOOLCHAIN: local
        run: go build -o /dev/null ./cmd/gokin

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.25.13'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o gokin-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/gokin
